# Project-wide Gradle settings.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true
# AGP 9 registers its own Kotlin extension; this project applies the Kotlin
# Gradle plugin explicitly, so disable the built-in one (as frogeon-remastered does).
android.builtInKotlin=false
# Keep the legacy DSL types that the Kotlin Gradle plugin 2.x requires with AGP 9.
android.newDsl=false
android.defaults.buildfeatures.resvalues=true

# App identity lives in ../app.properties (read by app/build.gradle.kts).
# Any of its keys can be overridden per build, e.g.:
#   ./gradlew -p AndroidStudio assembleRelease -Papp.id=com.example.other
